name: Apply BORE Patch to Exynos Branch

on:
  workflow_dispatch:

jobs:
  apply-bore-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Branch
        uses: actions/checkout@v4
        with:
          ref: Devandroid-bit-no-oc-undervolt
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Target Branch
        run: |
          git checkout -b Devandroid-bit-no-oc-bore-undervolt

      - name: Fetch SM8150 BORE Patch
        run: |
          curl -sSL "https://github.com/sidex15/android_kernel_lge_sm8150/commit/01baff0ae3abea5027d0cd5b827dab46465f0373.patch" -o bore.patch

      - name: Apply Patch via GNU Patch
        run: |
          # 'patch -p1' uses fuzzy line matching instead of strict Git SHA ancestor blobs
          patch -p1 --ignore-whitespace < bore.patch
          rm bore.patch

      - name: Commit with Original Credits
        run: |
          git add -A
          git commit -m "sched: import BORE Scheduler 5.1.0" \
                     -m "Source commit: 01baff0ae3abea5027d0cd5b827dab46465f0373" \
                     -m "Credits to original author: sidex15" \
                     -m "Applied to Exynos 9820/9825 kernel tree via automated workflow."

      - name: Push to Devandroid-bit-no-oc-bore-undervolt
        run: |
          git push -u origin Devandroid-bit-no-oc-bore-undervolt
