name: Build DevandroidKRNL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [d1xks]

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment
        run: |
          sudo apt-get update

          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils

          KERNEL_VERSION="$(uname -r)"
          EXTRA_MODULES="linux-modules-extra-${KERNEL_VERSION}"

          if apt-cache show "${EXTRA_MODULES}" >/dev/null 2>&1; then
            sudo apt-get install -yq "${EXTRA_MODULES}"
          else
            echo "::notice::${EXTRA_MODULES} is unavailable; skipping optional package."
          fi

          sudo modprobe erofs || echo "::warning::erofs module unavailable"
          sudo modprobe f2fs || echo "::warning::f2fs module unavailable"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build kernel (${{ matrix.target }})
        run: |
          ./build.sh -m ${{ matrix.target }} -k y -r n

      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v6
        with:
          name: kernel-${{ matrix.target }}
          path: build/out/${{ matrix.target }}/*.zip
