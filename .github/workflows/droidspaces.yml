
name: Droidspaces patches - Exynos 9820 4.14

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: droidspaces-kernel-patches
  cancel-in-progress: false

jobs:
  apply-droidspaces:
    runs-on: ubuntu-latest

    env:
      SOURCE_BRANCH: devandroid-no-oc-stock-voltage
      TARGET_BRANCH: devandroid-no-oc-stock-voltage-droidspaces

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: devandroid-no-oc-stock-voltage
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create destination branch
        shell: bash
        run: |
          set -euo pipefail

          git switch -c "$TARGET_BRANCH"

      - name: Install patch utility
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y patch

      - name: Clone Droidspaces-OSS
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 \
            https://github.com/Star-Seven/Droidspaces-OSS.git \
            "$RUNNER_TEMP/droidspaces"

          PATCH_DIR="$RUNNER_TEMP/droidspaces/Documentation/resources/kernel-patches/non-GKI"

          test -d "$PATCH_DIR" || {
            echo "::error::Droidspaces non-GKI patch directory not found"
            exit 1
          }

          echo "Available patches:"
          find "$PATCH_DIR" -maxdepth 1 -type f -name '*.patch' -print

      - name: Apply patch 01 - xt_qtaguid kernel panic fix
        shell: bash
        run: |
          set -euo pipefail

          PATCH_DIR="$RUNNER_TEMP/droidspaces/Documentation/resources/kernel-patches/non-GKI"
          PATCH_FILE="$PATCH_DIR/01.fix_kernel_panic_in_xt_qtaguid.patch"
          TARGET_FILE="net/netfilter/xt_qtaguid.c"

          cd "$GITHUB_WORKSPACE"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "::error::xt_qtaguid patch file not found"
            exit 1
          fi

          if [ ! -f "$TARGET_FILE" ]; then
            echo "::error::Required source file is missing: $TARGET_FILE"
            echo "Searching for xt_qtaguid.c in this repository:"

            find . \
              -type d -name .git -prune -o \
              -type f -name 'xt_qtaguid.c' -print

            echo "::error::Patch 01 was NOT applied. Adapt it to the actual Linux 4.14 source before proceeding."
            exit 1
          fi

          if patch --dry-run --batch --forward -p1 < "$PATCH_FILE"; then
            patch --batch --forward -p1 < "$PATCH_FILE"
            echo "Patch 01 applied successfully."

          elif patch --dry-run --batch --reverse -p1 < "$PATCH_FILE"; then
            echo "Patch 01 is already present; no duplicate application."

          else
            echo "::error::Patch 01 is incompatible with this kernel source."
            exit 1
          fi

      - name: Apply patch 02 - cgroup file prefix fix
        shell: bash
        run: |
          set -euo pipefail

          PATCH_DIR="$RUNNER_TEMP/droidspaces/Documentation/resources/kernel-patches/non-GKI"
          PATCH_FILE="$PATCH_DIR/02.fix_restore cgroup file prefix handling .patch"

          cd "$GITHUB_WORKSPACE"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "::error::Cgroup prefix patch not found"
            find "$PATCH_DIR" -maxdepth 1 -type f -name '*.patch' -print
            exit 1
          fi

          if [ ! -f kernel/cgroup/cgroup.c ]; then
            echo "::error::kernel/cgroup/cgroup.c is missing"
            exit 1
          fi

          if patch --dry-run --batch --forward -p1 < "$PATCH_FILE"; then
            patch --batch --forward -p1 < "$PATCH_FILE"
            echo "Patch 02 applied successfully."

          elif patch --dry-run --batch --reverse -p1 < "$PATCH_FILE"; then
            echo "Patch 02 is already present; no duplicate application."

          else
            echo "::error::Cgroup prefix patch is incompatible with this kernel source."
            exit 1
          fi

      - name: Validate kernel changes
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "=== Kernel version ==="
          make -s kernelversion

          echo "=== Changes ==="
          git diff --stat
          git status --short

      - name: Commit Droidspaces patches
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet; then
            git add -A

            git commit \
              -m "Apply Droidspaces fixes for Exynos 9820 kernel"
          else
            echo "Both patches are already present; no new commit needed."
          fi

      - name: Push destination branch
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_SHA="$(
            git ls-remote --heads origin \
              "refs/heads/${TARGET_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"

          if [ -n "$REMOTE_SHA" ]; then
            echo "Destination branch exists; updating generated branch."

            git push origin HEAD:"refs/heads/${TARGET_BRANCH}" \
              --force-with-lease="refs/heads/${TARGET_BRANCH}:${REMOTE_SHA}"
          else
            git push origin HEAD:"refs/heads/${TARGET_BRANCH}"
          fi

          echo "Destination branch: $TARGET_BRANCH"
